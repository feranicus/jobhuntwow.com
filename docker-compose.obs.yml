# Observability — Loki + Grafana + Promtail, wired 1:1 from OBSERVABILITY.md §8 (their pipeline).
# KISS: no OTel collector, no metrics server, no sidecars. Profile-gated: NEVER runs during a normal
# apply. Start with `python jhw.py obs`.
#
# Flow: the backend (observability.py) appends JSON to ./obs/events/events.log -> promtail tails it,
# promotes service/evt/severity to LABELS (so {service="jhw-web"} matches) -> Loki -> Grafana.
# Promtail gets NO docker socket (root-equivalent on the host); it only reads the event file. Secure
# by Design + least privilege (CLAUDE.md standing container rules kept on top of §8d).
services:
  loki:
    image: grafana/loki:3.0.0
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./obs/loki.yml:/etc/loki/loki.yml:ro
      - jhw_loki:/loki
    expose: [ "3100" ]
    security_opt: [ "no-new-privileges:true" ]
    mem_limit: 512m
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: "10m", max-file: "2" } }

  promtail:
    image: grafana/promtail:3.0.0
    # -config.expand-env=true so ${LOKI_URL} in promtail.yml is substituted (OBSERVABILITY.md §8a/§8d)
    command: -config.file=/etc/promtail/promtail.yml -config.expand-env=true
    environment:
      LOKI_URL: "http://loki:3100/loki/api/v1/push"
    volumes:
      - ./obs/promtail.yml:/etc/promtail/promtail.yml:ro
      - ./obs/events:/logs:ro            # jhw-web's events.log (bind-shared with the backend)
    depends_on: [ loki ]
    security_opt: [ "no-new-privileges:true" ]
    cap_drop: [ "ALL" ]
    mem_limit: 256m
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: "10m", max-file: "2" } }

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-jobhuntwow}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    volumes:
      - ./obs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./obs/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - jhw_grafana:/var/lib/grafana
    ports: [ "127.0.0.1:3000:3000" ]     # LOCAL ONLY
    depends_on: [ loki ]
    security_opt: [ "no-new-privileges:true" ]
    mem_limit: 512m
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: "10m", max-file: "2" } }

volumes:
  jhw_loki:
  jhw_grafana:
