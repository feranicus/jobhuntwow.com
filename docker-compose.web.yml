# JobHuntWOW web app (jhw-web) — PRODUCTION.
# The image is BUILT ON THE DROPLET from source shipped by `python jhw.py deploy` (deploy_direct.py).
# NO GitHub, NO GHCR, NO CI in the deploy path. Project 'jobhuntwow' at /opt/jobhuntwow.
#
# It joins the EXISTING external network that the droplet's shared Caddy is already on, so
# Caddy reaches it as http://jhw-web:8000. VideoDead / Amnezia / colt-stack are never touched.
#
# HARD RULES encoded here (see CLAUDE.md):
#   * NO published ports. Nothing on 0.0.0.0. Public traffic arrives only through the shared Caddy.
#   * ONE network only. A container on two networks makes Docker DNS hand the proxy an
#     unreachable IP -> intermittent 502 (this is a documented production outage).
#   * Secrets come from the droplet's /opt/jobhuntwow/.env (chmod 600, gitignored, never in the image).
#   * Least privilege + resource limits + healthcheck + bounded logs.
services:
  jhw-web:
    # Built DIRECTLY ON THE DROPLET from the source deploy_direct.py ships (no GitHub, no GHCR).
    # `image:` is only the local tag we build to.
    image: jhw-web:local
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: jhw-web
    env_file:
      - .env                      # runtime secrets on the droplet (DO_INFERENCE_KEY, AGENT_PROXY_TOKEN, ...)
    environment:
      - DATA_DIR=/data
      - FRONTEND_DIST=/app/frontend_dist
      - SERVICE=jhw-web
      # Write app events into the SAME shared events.log colt-web writes to and colt-promtail
      # ALREADY tails (-> Loki -> Grafana). This is the 1:1 cybergod pattern: every service
      # appends to /var/log/colt/events.log; the `service` field (jhw-web) separates us in
      # Grafana ({container=~".*assess-bot.*"} | json | service=`jhw-web`). A separate
      # jhw-web.log was the bug — nothing tailed it, so Loki had zero of our lines.
      - EVENTS_LOG=/var/log/colt/events.log
    volumes:
      - jhw_data:/data
      - jhw_events:/var/log/jhw
      - colt_events:/var/log/colt
    networks:
      - appnet
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  jhw_data: {}
  jhw_events: {}
  colt_events:
    external: true
    name: ${JHW_EVENTS_VOLUME:-colt-stack_colt_events}   # already tailed by colt-promtail

networks:
  appnet:
    external: true
    name: ${JHW_NETWORK:-videodead_appnet}    # the network the shared Caddy is already on
