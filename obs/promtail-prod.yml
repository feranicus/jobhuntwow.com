# PROD promtail for jobhuntwow — OBSERVABILITY.md §8a, "ship into an EXISTING Loki".
# Runs on the droplet as container `jhw-promtail`, attached to the shared Loki's network, tailing
# jhw-web's events file on the shared colt_events volume. It promotes `service` to a LABEL so the
# Grafana panels' {service="jhw-web"} selector matches. Touches NO other stack's config.
# Started + verified by `python jhw.py obs`. LOKI_URL is injected (-config.expand-env=true).
server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn
positions:
  filename: /tmp/promtail/positions.yaml
clients:
  - url: ${LOKI_URL}          # http://loki:3100/loki/api/v1/push on the shared network
scrape_configs:
  - job_name: app
    static_configs:
      - targets: [localhost]
        labels:
          service: jhw-web    # CFG.service in observability.py; the label the dashboards query
          job: jobhuntwow
          __path__: /logs/jhw-web.log     # jhw-web's EVENTS_LOG on the colt_events volume
    pipeline_stages:
      - json:
          expressions:
            evt: evt
            service: service
            status: status
            rule: rule
            severity: severity
            user: user
      - labels:
          evt:
          service:
          severity:
