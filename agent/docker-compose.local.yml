services:
  jhw-browser:
    build: .
    container_name: jhw-browser
    shm_size: 1gb
    environment:
    - DISPLAY=:0
    - CHROME_EXTRA_FLAGS=--disable-dev-shm-usage --disable-gpu --disable-extensions --disable-background-networking
    ports:
    - 127.0.0.1:9090:9090
    extra_hosts:
    - host.docker.internal:host-gateway
    networks:
    - jhw_shared
    security_opt:
    - no-new-privileges:true
    mem_limit: 2g
    cpus: 1.5
    volumes:
    - jhw_browser_profile:/home/chrome-user/chrome-data
    restart: unless-stopped
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://127.0.0.1:9222/json/version >/dev/null && curl -fsS http://127.0.0.1:9090/ >/dev/null
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  jhw-stagehand:
    # LEAST PRIVILEGE (a node HTTP service: no capability is needed).
    # cap_drop ONLY. `security_opt` is already set further down in this service, and adding a second
    # one produced `mapping key "security_opt" already defined` — docker compose REJECTS a duplicate
    # mapping key while PyYAML's safe_load silently keeps the last. My verification was therefore
    # weaker than the consumer, which is the whole reason this broke the stack.
    cap_drop: [ALL]
    build: ./stagehand-svc
    container_name: jhw-stagehand
    depends_on:
      jhw-browser:
        condition: service_healthy
    network_mode: service:jhw-browser
    environment:
    - PORT=8081
    - CDP_URL=http://127.0.0.1:9222
    - MODEL_NAME=${MODEL_NAME:-jhw-fast}
    - OPENAI_BASE_URL=http://backend:8000/v1
    - OPENAI_API_KEY=${AGENT_PROXY_TOKEN:-}
    security_opt:
    - no-new-privileges:true
    mem_limit: 1g
    cpus: 1.0
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  jhw-bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    container_name: jhw-bot
    env_file: .env
    environment:
    - JHW_OUT_DIR=/agent/out
    - JHW_PROFILE=/data/candidate.md
    # MEASURED 2026-08-16 from the bot's own Telegram message:
    #   "Model unavailable (tried deepseek-v4-pro, deepseek-3.2, llama-4-maverick).
    #    Last: ConnectError llama-4-maverick: [Errno 101] Network is unreachable"
    # Errno 101 = the container cannot reach the endpoint AT ALL. When the stack moved off the dead
    # host.docker.internal:8000 (Windows refuses that bind, WSAEACCES) I hardcoded the new address
    # for jhw-agent and jhw-stagehand and FORGOT jhw-bot, so it kept reading the dead value from
    # .env -- env_file wins when compose sets nothing. Hardcoded, not ${...}: interpolation would
    # pull the dead address straight back out of agent/.env.
    - JHW_PROXY_BASE=http://backend:8000/v1
    - OPENAI_BASE_URL=http://backend:8000/v1
    extra_hosts:
    - host.docker.internal:host-gateway
    networks:
    - jhw_shared
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    read_only: true
    tmpfs:
    - /tmp
    mem_limit: 512m
    cpus: 0.5
    volumes:
    - ./out:/agent/out
    - ./userdata:/data:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  jhw-agent:
    # LEAST PRIVILEGE (a python Playwright CLIENT — the browser is elsewhere).
    # cap_drop ONLY. `security_opt` is already set further down in this service, and adding a second
    # one produced `mapping key "security_opt" already defined` — docker compose REJECTS a duplicate
    # mapping key while PyYAML's safe_load silently keeps the last. My verification was therefore
    # weaker than the consumer, which is the whole reason this broke the stack.
    cap_drop: [ALL]
    build: .
    container_name: jhw-agent-local
    depends_on:
      jhw-browser:
        condition: service_healthy
    network_mode: service:jhw-browser
    env_file: .env
    environment:
    - JHW_CDP_URL=http://127.0.0.1:9222
    # HARDCODED on purpose. Compose interpolates ${...} from agent/.env, which still sets
    # JHW_PROXY_BASE=http://host.docker.internal:8000/v1 -- the address Windows now refuses to
    # bind (WSAEACCES). Using ${JHW_PROXY_BASE:-...} would silently restore that broken value.
    # compose `environment:` beats `env_file:`, so this line is the single source of truth.
    - JHW_PROXY_BASE=http://backend:8000/v1
    - JHW_STAGEHAND_URL=http://127.0.0.1:8081
    - JHW_ASK_CHANNEL=bridge
    - JHW_ASK_DIR=/agent/out/asks
    - JHW_ELECTRONIC_BASE=${JHW_ELECTRONIC_BASE:-https://jobhuntwow.com}
    - JHW_ELECTRONIC_EMAIL=${JHW_ELECTRONIC_EMAIL:-}
    - JHW_OUT=/agent/out
    volumes:
    - ./out:/agent/out
    - ./agent.py:/agent/agent.py:ro
    - ./tailor.py:/agent/tailor.py:ro
    - ./ask.py:/agent/ask.py:ro
    - ./obs.py:/agent/obs.py:ro
    - ./flows:/agent/flows:ro
    # READ-ONLY, AND ONLY SO A GUARD CAN SEE ITS SUBJECT. flows/test_models.py asserts that every role
    # in backend/app/llm.py resolves to a model the LIVE catalog actually has -- the guard that exists
    # because kimi-k2.6 returned HTTP 404 for an entire run while the log blamed the network. Without
    # this mount it printed "backend/app is not on this container's path" on EVERY apply, i.e. it never
    # ran once, which this project has repeatedly established is the same as not having the check.
    # The agent imports the backend for nothing else.
    - ../backend:/agent/backend:ro
    - ./templates:/agent/templates:ro
    - ./userdata:/agent/userdata:ro
    # HEALTHCHECK, after the whole volumes LIST -- a mapping key inserted between two sequence items
    # is invalid YAML, which is what my first edit produced. A long-running service must be able to
    # say it is ready (our own container rule 5); for this one, "ready" means the interpreter and the
    # flows package import.
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import sys; sys.path.insert(0,\"/agent/flows\"); import conduct'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    command:
    - sleep
    - infinity
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    mem_limit: 2g
    cpus: 1.0
networks:
  # EXTERNAL, shared with the repo-root compose so jhw-agent can reach the backend as
  # `backend:8000` with NO host port publish. Windows refused to bind 127.0.0.1:8000
  # (WSAEACCES: Hyper-V reserved range, re-picked on reboot), which is why the documented
  # host.docker.internal:8000 route died. Created by jhw.py::_ensure_shared_net.
  jhw_shared:
    external: true
volumes:
  jhw_browser_profile: null
